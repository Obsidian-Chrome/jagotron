<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pampa Grill - Jagotron</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="display-screen pampa-screen">
    <video class="background-video" autoplay loop muted playsinline>
        <source src="pampa_grill/pampa_grill_bg.mp4" type="video/mp4">
    </video>
    
    <div class="video-overlay"></div>
    
    <video class="embers-video" autoplay loop muted playsinline>
        <source src="pampa_grill/pampa_grill_embers.webm" type="video/webm">
    </video>
    
    <div class="full-screen-container">
        <div class="logo-display">
            <img src="pampa_grill/pampa_grill_logo.png" alt="Pampa Grill Logo" class="main-logo pampa-logo">
        </div>
    </div>
</body>
</html>
