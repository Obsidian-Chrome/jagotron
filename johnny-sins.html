<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnny Sins - Jagotron</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease-out;
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }

        .start-button {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            font-size: 2rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 6px;
        }

        .start-button:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="start-overlay" id="startOverlay">
        <button class="start-button" id="startButton">▶</button>
    </div>

    <div class="video-container">
        <video id="videoPlayer" loop muted playsinline>
            <source src="johnny_sins/johnny_sins.webm" type="video/webm">
        </video>
    </div>

    <audio id="audioPlayer" loop>
        <source src="johnny_sins/johnny_sins.mp3" type="audio/mpeg">
    </audio>

    <script>
        const startOverlay = document.getElementById('startOverlay');
        const startButton = document.getElementById('startButton');
        const videoPlayer = document.getElementById('videoPlayer');
        const audioPlayer = document.getElementById('audioPlayer');

        let audioContext;
        let analyser;
        let dataArray;

        startButton.addEventListener('click', async () => {
            startOverlay.classList.add('hidden');
            
            videoPlayer.play();
            audioPlayer.volume = 0.8;
            audioPlayer.play();

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaElementSource(audioPlayer);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            source.connect(analyser);
            analyser.connect(audioContext.destination);

            animateVideo();
        });

        function animateVideo() {
            requestAnimationFrame(animateVideo);

            if (!analyser) return;

            analyser.getByteFrequencyData(dataArray);

            const bassRange = dataArray.slice(0, 8);
            const bassAverage = bassRange.reduce((sum, val) => sum + val, 0) / bassRange.length;

            const normalizedBass = bassAverage / 255;
            const scale = 1.0 + (normalizedBass * 0.15);

            videoPlayer.style.transform = `scale(${scale})`;
        }
    </script>
</body>
</html>
